<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Road</title>

  <!-- Favicon: will 404 until you add escape-road/icon.png -->
  <link rel="shortcut icon" href="icon.png">

  <!-- Correct path: TemplateData/style.css exists -->
  <link rel="stylesheet" href="TemplateData/style.css">

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init()</script>
</head>

<style>
  @font-face {
    font-family: myFirstFont;
    /* Will 404 until you add Chainwhacks.otf into escape-road/ */
    src: url(Chainwhacks.otf);
  }
  #logo-canvas, body {
    font-family: myFirstFont;
  }
</style>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <p style="opacity: 0;position: absolute;">_</p>
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loading-cover" style="display:none;background: black;">
    <div id="unity-loading-bar">
      <canvas id="logo-canvas" style="position: absolute; background-color: black;">
        <!-- These three files DO exist in escape-road/ -->
        <img src="loading.png" id="ld_bg">
        <img src="car-icon.png" id="ld_car">
      </canvas>
    </div>
  </div>

  <!-- This exists: escape-road/az_logo.png -->
  <img id="azlogo" class="az" src="az_logo.png">

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");

    // Unity build files: all in TemplateData/
    const buildUrl = "TemplateData";
    const loaderUrl = buildUrl + "/loader.js";
    const config = {
      dataUrl: buildUrl + "/data.unityweb",
      frameworkUrl: buildUrl + "/framework.js.unityweb",
      codeUrl: buildUrl + "/wasm.unityweb",
      // You don't have StreamingAssets/, but Unity will just not load extra files
      streamingAssetsUrl: "StreamingAssets",
      companyName: "1games.io",
      productName: "Escape Road",
      productVersion: "2.0",
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    let logo_loaded = false;
    let logo_loading_percent = 0;
    const logo_canvas = document.getElementById("logo-canvas");

    async function load() {
      const az_logo = document.getElementById("azlogo");
      az_logo.style.opacity = 0;
      logo_loaded = true;
      az_logo.style.display = "none";
      logo_loaded = false;

      createUnityInstance(canvas, config, (progress) => {
        logo_loading_percent = progress;
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
          window.focus();
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    }

    loadingCover.style.display = "";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      load();
    };
    document.body.appendChild(script);

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    };
    window.onload = () => {
      drawCanvas(logo_loading_percent);
    };

    function drawCanvas(_percent = 0) {
      if (logo_loaded) return;

      resizeLogoCanvas();
      const ctx = logo_canvas.getContext("2d");
      const ld_bg = document.getElementById("ld_bg");
      const ld_car = document.getElementById("ld_car");

      const _sw = logo_canvas.width / 1920;
      const _sh = logo_canvas.height / 1080;

      if (_percent > 1) _percent = 1;

      // background
      ctx.drawImage(ld_bg, 0, 0, logo_canvas.width, logo_canvas.height);

      // loading bar background
      ctx.fillStyle = "#977e21";
      const _lw = 700;
      const _lh = 50;
      ctx.fillRect((1920 - _lw) * 0.5 * _sw, (1080 - 150) * _sh, _lw * _sw, _lh * _sh);

      // loading progress
      ctx.fillStyle = "#fad234";
      const _pad = 5;
      const _pw = (_lw - _pad * 2);
      const _ph = _lh - _pad * 2;
      const _px = (1920 - _pw) * 0.5;
      ctx.fillRect(_px * _sw, (1080 - 150 + _pad) * _sh, _pw * _percent * _sw, _ph * _sh);

      // optional car sprite (disabled)
      // let _car_x = _px + _pw * _percent - 100;
      // if (_car_x < _px) _car_x = _px;
      // ctx.drawImage(ld_car, _car_x * _sw, (1080 - 190) * _sh, 100 * _sw, 42 * _sh);

      ctx.font = "18px myFirstFont";
      const match = /(?<value>\d+\.?\d*)/;
      const setFontSize = (size) => ctx.font = ctx.font.replace(match, size);
      setFontSize(35 * _sh);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "black";
      ctx.shadowOffsetY = 2;
      const new_per = parseInt(_percent * 100);
      ctx.fillText(new_per + "%", logo_canvas.width / 2, logo_canvas.height / 2 + _sh * 425);
    }

    function resizeLogoCanvas() {
      const _w = window.innerWidth;
      const _h = window.innerHeight;
      const _nw = _h * 16 / 9;
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      } else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
    }
  </script>

  <!-- Firebase compat libs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics-compat.js"></script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2RwMfh0GMuQMtQdijjUo-MEffB4N9xVY",
      authDomain: "escape-road-gm1.firebaseapp.com",
      projectId: "escape-road-gm1",
      storageBucket: "escape-road-gm1.appspot.com",
      messagingSenderId: "713881704715",
      appId: "1:713881704715:web:615cc93a73d9814b24ea0e",
      measurementId: "G-E8C3TNJE0S"
    };

    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    window.gtag("config", firebaseConfig.measurementId, {
      cookie_domain: location.hostname,
      cookie_flags: "SameSite=None;Secure",
    });

    const app = firebase.initializeApp(firebaseConfig);
    const auth = getAuth(app);
  </script>

  <!-- This exists: escape-road/rocket-loader.min.js -->
  <script src="rocket-loader.min.js" defer></script>
</body>
</html>
